<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="rich-build" content="202611160502">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151515; --ink:#f2f3f6; --ink-2:rgba(242,243,246,.62); --ink-3:rgba(242,243,246,.36);
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.1); --line:rgba(255,255,255,.08);
  --amber:#e0a458; --accent:#7f9cf5;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --ring:240px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0d0d0d;
  font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv11" 1,"ss01" 1;font-optical-sizing:auto}
body{position:fixed;inset:0;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- stage (fixed phone canvas) ---------- */
#stage{position:absolute;left:0;top:0;width:404px;height:874px;transform-origin:0 0;
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;contain:layout paint}
body.canvas #stage{border-radius:48px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 120px rgba(0,0,0,.6)}


.screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;min-width:0}
.view{flex:1;min-height:0;min-width:0;display:none;flex-direction:column}
.view.on{display:flex}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(max(var(--safe-t), 14px) + 12px) 18px 0;height:calc(max(var(--safe-t), 14px) + 56px);flex:none}
.top .grp{display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:var(--ink-2);background:rgba(255,255,255,.045);transition:color .2s,background .2s}
.ib svg.i{width:19px;height:19px}
.sheet .ib{background:none}
.ib:hover,.ib:focus-visible{color:var(--ink);background:var(--glass)}
.ib:focus-visible{outline:none;box-shadow:0 0 0 1.5px rgba(127,156,245,.6)}
.demo-tag{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:rgba(255,255,255,.06);
  padding:4px 9px;border-radius:99px;display:none}
body.demo .demo-tag{display:inline-block}

/* balance */
.bal{flex:none;text-align:center;padding:6px 16px 8px;min-width:0}
.bal .lbl{font-size:14px;color:var(--ink-2);letter-spacing:.01em;cursor:pointer;display:inline-block;padding:2px 8px;border-radius:10px}
.bal .lbl:hover{background:rgba(255,255,255,.05)}
.bal .amt{display:flex;justify-content:center;align-items:baseline;width:100%;margin-top:4px;font-weight:300;letter-spacing:-.045em;line-height:1;white-space:nowrap;
  font-size:64px;color:#f5f6f8}
.money-big .p{font-size:.56em;font-weight:400;color:var(--ink-2);margin-right:.08em;letter-spacing:0;align-self:flex-start;margin-top:.14em}
.money-big .c{font-size:.5em;color:var(--ink-3);letter-spacing:-.02em;margin-left:.02em}
.bal .amt.neg{color:#eab37a}
.bal .amt.neg .p,.bal .amt.neg .c{color:rgba(234,179,122,.6)}
.bal button.amt{cursor:pointer}

/* ring */
.ringwrap{flex:none;display:grid;place-items:center;padding:10px 0 4px;touch-action:pan-y}
.ring{position:relative;width:var(--ring);height:var(--ring)}
.ring svg{width:100%;height:100%;display:block;overflow:visible}
.ring .center{position:absolute;inset:22%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:background .25s}
.ring .center:hover{background:rgba(255,255,255,.03)}
.ring .center:focus-visible{outline:none;background:rgba(255,255,255,.05)}
.ring .center .s1{font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.ring .center .s2{display:flex;align-items:baseline;font-size:28px;font-weight:400;letter-spacing:-.035em;white-space:nowrap}
.ring .center .s3{margin-top:4px;width:26px;height:26px;border-radius:13px;display:grid;place-items:center;background:var(--glass);color:var(--ink-2)}
.ring .center .s3 svg{width:15px;height:15px}

/* legend */
.legend{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 18px 10px;display:flex;flex-direction:column;gap:2px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 16px),transparent);scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.row{position:relative;flex:none;display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:7px;
  padding:9px 10px;border-radius:14px;text-align:left;min-width:0;overflow:hidden}
.row:hover{background:rgba(255,255,255,.035)}
.row .dot{width:8px;height:8px;border-radius:4px}
.row .nm{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:14px;font-weight:500;white-space:nowrap;letter-spacing:-.01em}
.row .v small{font-size:inherit;font-weight:400;color:var(--ink-3)}
.row .bar{grid-column:2 / 4;height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:2px;background:var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.row.over .v{color:var(--amber)}
.row.over .bar{box-shadow:inset 0 0 0 1px rgba(224,164,88,.55)}
.row.zero .nm{color:var(--ink-2)}
.row.zero .v{color:var(--ink-3)}
.row.sheen::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);
  transform:translateX(-100%);animation:sheen .9s ease-out forwards}
@keyframes sheen{to{transform:translateX(100%)}}

/* month wheel */
.wheel{flex:none;height:58px;transition:opacity .2s;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;display:flex;scrollbar-width:none;
  overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{flex:none;width:calc(50% - 60px)}
.wm{flex:none;width:120px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:19px;font-weight:500;letter-spacing:-.015em;color:var(--ink);will-change:transform,opacity;transform-origin:50% 50%}
.wm .yr{font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--ink-3);height:12px;line-height:12px}

/* nav */
.nav{flex:none;display:flex;justify-content:space-around;padding:2px 36px calc(10px + var(--safe-b));background:transparent}
.nav button{position:relative;width:64px;height:48px;display:grid;place-items:center;color:var(--ink-3);border-radius:16px;transition:color .2s}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:color .2s,transform .3s cubic-bezier(.2,.8,.2,1)}
.nav button.press{transform:scale(.86);transition:color .2s,transform .45s ease-in}
.nav svg.i{width:24px;height:24px}

/* bills */
.ttl{font-size:17px;font-weight:600;letter-spacing:-.01em;padding-left:4px}
.bsum{flex:none;text-align:center;padding:4px 16px 10px}
.bsum .lbl{font-size:14px;color:var(--ink-2)}
.bsum .amt{display:flex;justify-content:center;align-items:baseline;margin-top:4px;font-weight:300;letter-spacing:-.04em;line-height:1;font-size:48px;white-space:nowrap}
.bsum .meta{margin-top:10px;font-size:13px;color:var(--ink-3);display:flex;justify-content:center;gap:14px}
.stat{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.06);font-size:13px;color:var(--ink-2);margin:0 3px}
.stat.od{color:var(--amber);background:rgba(224,164,88,.1)}
.bsum .meta b{font-weight:500;color:var(--ink-2)}
.bsum .meta .od b{color:var(--amber)}
.bprog{height:4px;border-radius:2px;background:rgba(255,255,255,.07);margin:12px 40px 0;overflow:hidden}
.bprog i{display:block;height:100%;background:#AEB7CA;border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.blist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 12px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 16px),transparent)}
.blist::-webkit-scrollbar{display:none}
.bgh{font-size:12px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:14px 8px 6px;display:flex;justify-content:space-between}
.bgh.od{color:var(--amber)}
.brow{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;column-gap:8px;padding:6px 8px 6px 2px;border-radius:16px;overflow:hidden}
.brow:hover{background:rgba(255,255,255,.03)}
.chk{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;color:var(--ink-3)}
.chk .o{width:22px;height:22px;border-radius:11px;box-shadow:inset 0 0 0 1.6px currentColor;display:grid;place-items:center;transition:background .2s,color .2s}
.chk:hover .o{color:var(--ink-2)}
.brow.od .chk{color:rgba(224,164,88,.8)}
.brow.paid .chk .o{background:#e9ebf0;box-shadow:none;color:#151515}
.chk svg{width:14px;height:14px;stroke-width:2.4;opacity:0}
.brow.paid .chk svg{opacity:1}
.binfo{min-width:0;text-align:left;cursor:pointer;outline:none;display:flex;flex-direction:column;gap:3px;padding:4px 0}
.binfo .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.binfo .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.brow.od .binfo .sub{color:var(--amber)}
.brow.paid .binfo .nm{color:var(--ink-2)}
.brow .am{font-size:15px;font-weight:500;white-space:nowrap}
.brow.paid .am{color:var(--ink-2)}
.pchip{position:relative;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:rgba(255,255,255,.08);color:var(--ink-2);font-size:12px}
.pchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:pointer}
.pchip input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
.rep-ic{width:12px;height:12px;flex:none}
.bempty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 20px;color:var(--ink-3);font-size:14px}
.pill{height:40px;padding:0 18px;border-radius:20px;background:rgba(255,255,255,.08);font-size:14px;font-weight:500;color:var(--ink)}
.brow.sheen::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);transform:translateX(-100%);animation:sheen .9s ease-out forwards}
/* bill sheet */
.bform{padding:0 14px;display:flex;flex-direction:column;gap:10px}
.field{height:48px;border-radius:16px;border:0;outline:none;background:rgba(255,255,255,.06);padding:0 16px;font-size:16px;color:var(--ink);width:100%}
.field::placeholder{color:var(--ink-3)}
.frow{display:flex;gap:8px;align-items:center}
.repbox{flex:1;display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 8px 0 16px;border-radius:25px;background:var(--glass);font-size:14px;color:var(--ink-2);min-width:0}
.repbox span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghostbtn{height:50px;padding:0 16px;border-radius:25px;background:var(--glass);font-size:15px;font-weight:500;white-space:nowrap}
.ghostbtn.danger{color:#ff8a7a}

/* papa */
.flow{background:var(--glass);border-radius:18px;padding:4px 14px;margin:6px 2px 4px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;min-height:36px;color:var(--ink-2)}
.fr b{font-weight:500;color:var(--ink);white-space:nowrap}
.fr.tot{border-top:1px solid var(--line);color:var(--ink);font-weight:500}
.fr.tot b{font-weight:600}
.fr .mini{height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:500;color:var(--ink)}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:7px 8px 7px 4px;border-radius:14px;cursor:pointer;text-align:left;width:100%}
.prow:hover{background:rgba(255,255,255,.03)}
.prow .ic{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.prow .ic svg{width:17px;height:17px}
.prow .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.prow .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.prow .sub .fl{color:var(--amber)}
.prow .am{font-size:15px;font-weight:500;white-space:nowrap}
.prow .am.pos{color:#a8d8b6}
.bgh .addl{font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:500}
.brow .am.blank{color:var(--ink-3);font-weight:400;font-size:13px}
.ptype{margin:2px 14px 0;display:flex}
.ptype button{flex:1}

/* papa v2 */
.act{margin-top:12px;display:flex;justify-content:center;min-height:36px}
.act .pill{height:36px;display:flex;align-items:center;gap:7px}
.act .pill svg{width:15px;height:15px;stroke-width:2.2}
.act .done{height:36px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.act .done svg{width:14px;height:14px;stroke-width:2.4}
.act .undo{height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:500;color:var(--ink-2);background:rgba(255,255,255,.06);margin-left:8px}
.bsum .amt.dim{opacity:.32;transition:opacity .3s}
.bsum .lbl.dim{color:var(--ink-3)}
.tiles{display:flex;gap:8px;margin:2px 2px 4px}
.tile{flex:1;min-width:0;background:var(--glass);border-radius:16px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tile span{font-size:12px;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between}
.tile b{font-size:16px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile svg{width:13px;height:13px;transition:transform .25s}
.tile[aria-expanded="true"] svg{transform:rotate(180deg)}
.bd{display:none;background:var(--glass);border-radius:16px;padding:2px 14px;margin:0 2px 4px}
.bd.on{display:block}
.bd .fr{min-height:34px;font-size:13.5px}
.prow .nm .fd{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--amber);margin-right:6px;vertical-align:middle}
.bgh .addl{display:inline-flex;align-items:center;gap:4px}
.dayrow{display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 8px 0 16px;border-radius:25px;background:var(--glass);font-size:14px;color:var(--ink-2)}
.dayrow select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.1);border:0;border-radius:17px;height:34px;padding:0 14px;color:var(--ink);font:inherit;font-size:14px;font-weight:500;outline:none}
.srs{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 6px;border-radius:14px;text-align:left;width:100%}
.srs:hover{background:rgba(255,255,255,.03)}
.srs .ic{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.srs .ic svg{width:17px;height:17px}
.srs .nm{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srs .sub{font-size:12px;color:var(--ink-3);display:block;margin-top:2px}
.srs .am{font-size:15px;font-weight:500}
.srs .am.v{color:var(--ink-3);font-weight:400}

/* papa: recurring rows */
.prow .ic{position:relative}
.prow.rec .ic{cursor:pointer}
.prow.unpaid .ic{background:rgba(255,255,255,.045);color:var(--ink-3);box-shadow:inset 0 0 0 1.4px rgba(255,255,255,.12)}
.prow.unpaid .nm{color:var(--ink-2)}
.prow.unpaid .am{color:var(--ink-3);font-weight:400}
.prow.od .sub{color:var(--amber)}
.prow .ck{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:8px;background:#e9ebf0;color:#151515;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.prow .ck svg{width:10px;height:10px;stroke-width:3}
.prow .sub .ri{width:11px;height:11px;vertical-align:-1px;margin-right:4px;stroke-width:2}
.prow.sheen{position:relative;overflow:hidden}
.prow.sheen::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);transform:translateX(-100%);animation:sheen .9s ease-out forwards}
#s-papa{overflow-y:auto;overscroll-behavior:contain}
#pe-var{display:flex}
#pe-var button{flex:1}
.pe-rec{display:none;flex-direction:column;gap:10px}
.pe-rec.on{display:flex}

/* bottom add button */
.fabrow{flex:none;display:flex;justify-content:center;padding:6px 0 2px}
.fab{position:relative;width:52px;height:52px;border-radius:26px;display:grid;place-items:center;color:#f2f3f6;background:#3a3b40;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s,background .2s}
.fab:hover{background:#44454b}
.fab svg.i{position:relative;z-index:1}
.fab:active{transform:scale(.94)}
.fab svg.i{width:22px;height:22px;stroke-width:1.8}

/* half-height glass sheet (category history) */
.sheet.half{height:46%;min-height:300px;background:rgba(40,40,44,.38);
  backdrop-filter:blur(34px) saturate(1.7);-webkit-backdrop-filter:blur(34px) saturate(1.7);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.14),0 20px 60px rgba(0,0,0,.45)}
.sheet.half .hd{min-height:38px}
.sheet.half .hd h2{font-size:15px}
.sheet.half .chips{padding-bottom:6px}
.sheet.half .hsum{padding-top:2px}
.sheet.half .chip{background:rgba(255,255,255,.08)}
.sheet.half .chip[aria-pressed="true"]{background:rgba(255,255,255,.24);color:var(--ink)}
.sheet.half .hlist{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 18px),transparent)}
.scrim.light{background:rgba(0,0,0,.18)}

/* controls on glass */
.sheet .field,.sheet .repbox,.sheet .datebtn,.sheet .dayrow,.sheet .ghostbtn,.sheet .qc .ic,.sheet .card,.sheet .chip,.sheet .seg{background:rgba(255,255,255,.08)}
.sheet .seg button[aria-pressed="true"],.sheet .chip[aria-pressed="true"]{background:rgba(255,255,255,.22);color:var(--ink)}
.sheet .qc[aria-pressed="true"] .ic{background:color-mix(in srgb,var(--c) 30%,transparent)}
.sheet .datebtn.past{background:rgba(255,255,255,.16)}

/* compact Quick Add: amount left, date + save top right */
.grabbtn{display:block;border:0;padding:0;cursor:pointer;width:44px;height:5px;margin:8px auto 2px;box-shadow:0 0 0 10px transparent}
.qa-top{display:flex;align-items:center;gap:8px;padding:8px 12px 0 20px}
#s-add .qa-amt{flex:1;min-width:0;justify-content:flex-start;padding:0;gap:3px}
#s-add .qa-amt .cur{font-size:24px}
#s-add .qa-amt input{font-size:42px;max-width:none;width:0;flex:1}
#s-add .datebtn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:23px;flex:none}
#s-add .datebtn.icon svg.i{width:20px;height:20px}

  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 26px),transparent)}
/* progressive blur: stacked layers, each blurrier and masked lower */
.bblur{position:absolute;left:0;right:0;bottom:0;height:104px;z-index:2;pointer-events:none}
.bblur i{position:absolute;inset:0;display:block}
.bblur i:nth-child(1){backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 25%,#000 50%,transparent 70%);mask-image:linear-gradient(180deg,transparent 0%,#000 25%,#000 50%,transparent 70%)}
.bblur i:nth-child(2){backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(180deg,transparent 25%,#000 50%,#000 70%,transparent 85%);mask-image:linear-gradient(180deg,transparent 25%,#000 50%,#000 70%,transparent 85%)}
.bblur i:nth-child(3){backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);-webkit-mask-image:linear-gradient(180deg,transparent 50%,#000 70%,#000 100%);mask-image:linear-gradient(180deg,transparent 50%,#000 70%,#000 100%)}
.bblur i:nth-child(4){background:linear-gradient(180deg,rgba(21,21,21,0) 0%,rgba(21,21,21,.2) 40%,rgba(21,21,21,.7) 80%,#151515 100%)}

/* lock */
.lock{position:absolute;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:rgba(21,21,21,.86);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px)}

/* sync + categories in settings */
.syncdot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--ink-3)}

/* ---------- light theme ---------- */

body.light .fab{background:#dcdce1;color:#151518}
body.light .row .bar,body.light .bprog,body.light .lim-track input::-webkit-slider-runnable-track{background-color:rgba(0,0,0,.08)}

body.light .tog{background:rgba(0,0,0,.14)}

body.light .swr .brw{background:var(--bg)}
body.light .bblur i:nth-child(4){background:linear-gradient(180deg,rgba(243,243,245,0) 0%,rgba(243,243,245,.3) 45%,rgba(243,243,245,.75) 85%,#f3f3f5 100%)}
body.light .lock{background:rgba(243,243,245,.9)}
body.light .lock-dots i{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.4)}

body.light .lock-pad button{background:rgba(0,0,0,.06)}
body.light .dp-grid button.sel,body.light .monp-grid button.sel,body.light .dayp-grid button.sel{background:#151518;color:#fff}
body.light .scrim{background:rgba(0,0,0,.12)}
body.light #bill-list .prow:not(.unpaid) .am{text-decoration-color:rgba(21,21,24,.5)}
body.light .tin b{color:#2f8f57}body.light .tout b{color:#c4533f}
body.light .row.over .v,body.light .qa-msg.warn{color:#b8741d}

.balmeta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:0;margin:4px 16px 2px}
.balmeta:empty{display:none}
.chip2{height:26px;padding:0 10px;border-radius:13px;font-size:12px;display:inline-flex;align-items:center;background:rgba(255,255,255,.07);color:var(--ink-2)}
.chip2.green{color:#9fd3b0;background:rgba(120,200,145,.14)}
.chip2.amber{color:#f0c96a;background:rgba(240,201,106,.12)}
.chip2.btn{color:var(--ink);background:rgba(255,255,255,.12);font-weight:500}
.hsearchbtn{width:34px;height:34px;background:none !important;margin-left:auto;margin-right:4px}
.hsearchbtn svg.i{width:17px;height:17px}
.hsearch{padding:0 14px 6px}
.hsearch input{width:100%;height:38px;border:0;outline:none;border-radius:12px;background:rgba(255,255,255,.08);padding:0 14px;font-size:14px;color:var(--ink)}
.hrow{cursor:pointer}
.ychart{width:100%;height:auto;color:var(--ink);margin:6px 0 4px}
.ysum{display:flex;gap:20px;padding:6px 8px 0}
.ysum div{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.ysum i{width:8px;height:8px;border-radius:4px}

body.light .chip2{background:rgba(0,0,0,.05)} body.light .chip2.btn{background:rgba(0,0,0,.1)} body.light .hsearch input{background:rgba(0,0,0,.05)}
body.light .chip2.green{color:#2f8f57} body.light .chip2.amber{color:#a8701a}

#s-add .scanbtn{width:46px;height:46px;padding:0;justify-content:center;border-radius:23px;flex:none;background:none !important;color:var(--ink-2)}
#s-add .scanbtn svg.i{width:21px;height:21px}
.sc-body{flex:1;min-height:0;overflow-y:auto;padding:4px 14px}
.sc-wait{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 20px;color:var(--ink-2);font-size:14px;text-align:center}
.spin{width:26px;height:26px;border-radius:13px;border:2.5px solid rgba(255,255,255,.15);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line)}
.sc-row .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis}
.sc-row .nm small{display:block;font-size:11px;color:var(--amber)}
.sc-row.unsure{background:rgba(240,201,106,.07);border-radius:10px}
.sc-row select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.08);border:0;border-radius:10px;height:30px;padding:0 10px;color:var(--ink);font:inherit;font-size:12.5px;max-width:110px}
.sc-row .money input{width:72px}
.sc-tot{padding:10px 6px}
.sc-tot div{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);padding:3px 0}

/* placeholder views */
.soon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-3);font-size:14px;text-align:center;padding:0 40px}
.soon svg.i{width:34px;height:34px;color:var(--ink-2)}
.soon b{color:var(--ink);font-weight:600;font-size:17px}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .28s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:21;border-radius:30px;
  background:rgba(40,40,44,.42);backdrop-filter:blur(60px) saturate(1.8);-webkit-backdrop-filter:blur(60px) saturate(1.8);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.14),0 20px 60px rgba(0,0,0,.45);
  transform:translateY(calc(100% + 20px));transition:transform .38s cubic-bezier(.2,.9,.25,1),visibility 0s .38s;visibility:hidden;display:flex;flex-direction:column;
  padding-bottom:calc(6px + var(--safe-b));max-height:calc(100% - 16px - var(--safe-t))}
.sheet.on{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:8px auto 2px;flex:none}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 0;flex:none;min-height:44px}
.sheet .hd h2{font-size:16px;font-weight:600}
.sheet.tall{top:calc(16px + var(--safe-t))}

/* quick add */
.qa-amt{display:flex;align-items:baseline;justify-content:center;gap:2px;padding:6px 20px 2px;min-width:0}
.qa-amt .cur{font-size:30px;font-weight:300;color:var(--ink-3)}
.qa-amt input{width:0;flex:1;max-width:280px;background:none;border:0;outline:none;text-align:left;font-size:54px;font-weight:300;letter-spacing:-.045em;caret-color:var(--ink)}
.qa-amt input::placeholder{color:var(--ink-3)}
.qa-cats{display:flex;gap:4px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x}
.qa-cats::-webkit-scrollbar{display:none}
.qc{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:start;color:var(--ink-3)}
.qc .ic{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;background:var(--glass);color:var(--ink-2);transition:background .2s,color .2s,box-shadow .2s}
.qc span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.qc[aria-pressed="true"] .ic{background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.qc[aria-pressed="true"] span{color:var(--ink)}
.qa-msg{height:22px;text-align:center;font-size:13px;color:var(--ink-3);padding-top:4px}
.qa-msg.warn{color:var(--amber)}
.qa-msg.ok{color:#9fd3b0}
.qa-foot{display:flex;gap:8px;padding:6px 12px 6px}
.datebtn{position:relative;display:flex;align-items:center;gap:7px;height:50px;padding:0 14px;border-radius:25px;background:var(--glass);color:var(--ink-2);font-size:14px;white-space:nowrap}
.datebtn svg.i{width:18px;height:18px}
.datebtn.past{color:var(--ink);background:rgba(255,255,255,.13)}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.datebtn input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
.save{flex:1;height:50px;border-radius:25px;font-weight:600;font-size:16px;background:#f2f3f6;color:#151515;transition:opacity .2s,filter .2s}
.save:disabled{opacity:.35;cursor:default}
.save:not(:disabled):active{filter:brightness(.9)}

/* history */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:15px;font-size:13px;background:var(--glass);color:var(--ink-2);display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.16);color:var(--ink)}
.chip i{width:7px;height:7px;border-radius:4px}
.hlist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 10px}
.hday{font-size:12px;color:var(--ink-3);padding:12px 8px 4px;text-transform:uppercase;letter-spacing:.06em}
.hrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto 34px;align-items:center;gap:10px;padding:7px 4px 7px 8px;border-radius:12px}
.hrow .ic{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.hrow .ic svg{width:17px;height:17px}
.hrow .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .am{font-size:14px;font-weight:500}
.hrow .del{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--ink-3)}
.hrow .del svg{width:17px;height:17px}
.hrow .del.arm{color:#ff8a7a;background:rgba(255,120,100,.12)}
.hsum{display:flex;justify-content:space-between;padding:6px 18px 4px;font-size:13px;color:var(--ink-3);flex:none}
.empty{color:var(--ink-3);font-size:14px;text-align:center;padding:40px 20px}

/* settings */
.slist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 12px}
.sgrp{margin-top:14px}
.sgrp h3{font-size:12px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:0 6px 6px}
.card{background:var(--glass);border-radius:18px;overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}

.money{display:flex;align-items:center;gap:2px;color:var(--ink-2);font-size:14px}

.money input::placeholder{color:var(--ink-3)}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:default}
.tog{width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.14);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .2s}
.tog[aria-checked="true"]{background:#e9ebf0}
.tog[aria-checked="true"]::after{background:#151515}
.tog[aria-checked="true"]::after{transform:translateX(18px)}
.txtbtn{font-size:14px;color:var(--ink);font-weight:500;padding:8px 4px}
.danger{color:#ff8a7a}
.addcat{display:flex;gap:8px;padding:8px 14px 10px;border-top:1px solid var(--line)}
.addcat input{flex:1;min-width:0;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.06);padding:0 10px;outline:none;font-size:14px}
.note{font-size:12px;color:var(--ink-3);padding:8px 6px 0;line-height:1.45}

/* dialog */
.dlg{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.25);padding:28px}
.dlg.on{display:grid}
.dlg .box{width:100%;max-width:320px;border-radius:24px;background:rgba(44,44,48,.45);backdrop-filter:blur(44px) saturate(1.8);-webkit-backdrop-filter:blur(44px) saturate(1.8);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.14),0 20px 60px rgba(0,0,0,.4);padding:20px 16px 12px;text-align:center}
.dlg h4{font-size:16px;font-weight:600}
.dlg p{font-size:13px;color:var(--ink-2);margin:6px 0 14px;line-height:1.45}
.dlg .acts{display:flex;flex-direction:column;gap:6px}
.dlg .acts button{height:44px;border-radius:14px;background:rgba(255,255,255,.08);font-size:15px}
.dlg .acts button.pri{background:#f2f3f6;color:#151515;font-weight:600}
.dlg .acts button.ghost{background:none;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){
  .sheet,.scrim,.tog::after{transition:none}
  .row.sheen::after{animation:none}
}

<div id="stage" role="application" aria-label="Rich">

  <div class="screen">

function allowanceFor(db, i){
  const k = mKey(i); let c = 0;
  for (const a of [...db.allowances].sort((x,y)=>x.from<y.from?-1:1)) if (a.from <= k) c = a.c;
  return c;
}
function occurrences(db, i){
  const k = mKey(i), {y,m} = mFromIndex(i), out = [];
  for (const b of db.bills){
    if (b.kind === 'monthly'){
      if (b.start > k || (b.end && b.end < k)) continue;
      const o = (b.ov||{})[k] || {}; if (o.skip) continue;
      const day = o.day ?? b.day;
      out.push({key:b.id+'@'+k, bill:b, name:o.name ?? b.name, c:o.c ?? b.c, due:isoDate(y,m,Math.min(day,daysIn(y,m))), month:i});
    } else if (b.due.slice(0,7) === k) out.push({key:b.id, bill:b, name:b.name, c:b.c, due:b.due, month:i});
  }
  const tISO = todayISO();
  for (const o of out){
    const p = db.paid[o.key]; o.paid = p || null; if (p) o.c = p.c;
    const k2 = o.key.split('@')[1];
    if (!p && o.bill.auto && o.c != null && o.due <= tISO && !((o.bill.ov||{})[k2]||{}).noauto) o.paid = {date:o.due, c:o.c, auto:true};
  }
  return out.sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : a.name.localeCompare(b.name));
}
function earliestBillMonth(db){
  let min = Infinity;
  for (const b of db.bills){ const d = b.kind==='monthly' ? parseISO(b.start+'-01') : parseISO(b.due); if (d) min = Math.min(min, mIndex(d.y,d.m)); }
  return min;
}
function overdueBefore(db, i){ // unpaid occurrences from earlier months
  const out = [], from = Math.max(earliestBillMonth(db), i-24);
  for (let j=from; j<i; j++) for (const o of occurrences(db, j)) if (!o.paid) out.push(o);
  return out;
}
function monthData(db, i){
  const k = mKey(i), per = {}; let exp = 0;
  db.categories.forEach(c => per[c.id]=0);
  for (const e of db.expenses) if (e.date.slice(0,7)===k){ per[e.cat] = (per[e.cat]||0) + e.c; exp += e.c; }
  const occ = occurrences(db, i);
  const billsDue = occ.reduce((s,o)=>s+o.c,0), billsPaid = occ.reduce((s,o)=>s+(o.paid?o.c:0),0);
  const so = occ.filter(o => isSub(o.bill)), subDue = so.reduce((s,o)=>s+(o.c||0),0), subPaid = so.reduce((s,o)=>s+(o.paid?(o.c||0):0),0);
  per.__bills = billsPaid;
  const allow = allowanceFor(db, i), spent = exp + billsPaid, carry = carryIn(db, i);
  return {per, exp, spent, allow, billsDue, billsPaid, subDue, subPaid, occ, carry, left: allow - spent - carry};
}
// a shortfall you chose to carry comes out of the next month
function carryIn(db, i){
  if (i <= RANGE_START) return 0;
  const p = i - 1; if (!allowanceFor(db, p)) return 0;
  const left = monthData(db, p).left;
  return left < 0 && (db.closes||{})[mKey(p)] === 'carry' ? -left : 0;
}

/* ================= ring ================= */
const R = 106, SW = 22, C = 130;
const CAP = (SW/2)/R*180/Math.PI;       // degrees taken by one round cap
const GAP = 4.5;                          // visual gap between pills
const MINSPAN = 2*CAP + GAP + 7;
const ringEl = document.getElementById('ring');
const pt = a => { const r=(a-90)*Math.PI/180; return [C+R*Math.cos(r), C+R*Math.sin(r)]; };
function arcPath(a0,a1){
  if (a1-a0 < 0.02) a1 = a0+0.02;
  const [x0,y0]=pt(a0),[x1,y1]=pt(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function layout(vals){ // vals: [{v, ...}] -> spans in degrees with min span for visible pills
  const total = vals.reduce((s,x)=>s+x.v,0);
  if (total <= 0) return vals.map(()=>0);
  const thr = Math.max(1, total*0.0004);
  const mins = vals.map(x => x.v<=0 ? 0 : MINSPAN*Math.min(1, x.v/thr));
  let spans = vals.map(x => x.v/total*360);
  const fixed = vals.map(()=>false);
  for (let it=0; it<6; it++){
    spans.forEach((s,i)=>{ if (s < mins[i]) fixed[i] = true; });
    const fixedSum = spans.reduce((s,_,i)=> s + (fixed[i]?mins[i]:0), 0);
    const freeTotal = vals.reduce((s,x,i)=> s + (fixed[i]?0:x.v), 0);
    if (freeTotal<=0) break;
    spans = vals.map((x,i)=> fixed[i] ? mins[i] : x.v/freeTotal*(360-fixedSum));
  }
  return spans;
}
function drawRing(st){
  const db = DB();
  return drawRingLimits(st, db);
  const items = db.categories.map(c => ({v:st.per[c.id]||0, color:c.color, over: c.limit!=null && st.real[c.id] > c.limit}));
  const rem = Math.max(0, st.allow - st.spent);
  items.push({v:rem, color:TRACK(), track:true});
  const n = items.filter(x=>x.v>0).length;
  let out = '';
  if (n === 0 || (n===1 && items[items.length-1].v>0)){
    out = `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${TRACK()}" stroke-width="${SW}"/>`;
  } else {
    const spans = layout(items);
    let a = 0;
    items.forEach((x,i) => {
      const sp = spans[i]; if (sp <= 0.01){ return; }
      const inner = sp - GAP - 2*CAP;
      const w = SW * Math.max(0.15, Math.min(1, sp/MINSPAN));
      const mid = a + sp/2;
      const a0 = inner > 0 ? a + GAP/2 + CAP : mid, a1 = inner > 0 ? a + sp - GAP/2 - CAP : mid;
      const d = arcPath(a0,a1);
      if (x.over) out += `<path d="${d}" fill="none" stroke="${'#e0a458'}" stroke-width="${w+6}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${GAPC()}" stroke-width="${w+2.5}" stroke-linecap="round"/>`;
      out += `<path d="${d}" fill="none" stroke="${x.color}" stroke-width="${w}" stroke-linecap="round"${x.track?'':' opacity=".92"'}/>`;
      a += sp;
    });
  }
  ringEl.innerHTML = out;
}

const BILL_COLOR = '#6F98C8';
function drawRingLimits(st, db){
  // bill groups: segment = everything due this month, drains as bills are paid
  const billItems = Object.keys(st.dues||{}).map(k => {
    const due = st.dues[k]||0, paid = st.per['b:'+k]||0, v = Math.max(due, paid);
    return {v, fill: v>0 ? paid/v : 0, color: (st.bcol||{})[k] || BILL_COLOR, bill:true};
  });
  const items = billItems.concat(db.categories.map(c => {
    const v = st.per[c.id]||0, real_ = st.real[c.id]||0;
    const span = c.limit!=null ? Math.max(c.limit, v) : v;
    return {v:span, fill: span>0 ? v/span : 0, color:c.color, over: c.limit!=null && real_ > c.limit};
  }));
  const used = items.reduce((s,x)=>s+x.v,0);
  items.push({v: Math.max(0, st.allow - used), track:true, color:TRACK()});
  if (!items.some(x=>x.v>0 && !x.track)){
    ringEl.innerHTML = `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${TRACK()}" stroke-width="${SW}"/>`; return;
  }
  const spans = layout(items); let a = 0, out = '';
  items.forEach((x,i) => {
    const sp = spans[i]; if (sp <= 0.01) return;
    const inner = sp - GAP - 2*CAP, mid = a + sp/2;
    const w = SW * Math.max(0.15, Math.min(1, sp/MINSPAN));
    const a0 = inner > 0 ? a + GAP/2 + CAP : mid, a1 = inner > 0 ? a + sp - GAP/2 - CAP : mid;
    if (x.track){ out += `<path d="${arcPath(a0,a1)}" fill="none" stroke="${x.color}" stroke-width="${w}" stroke-linecap="round"/>`; a += sp; return; }
    const d = arcPath(a0,a1);
    if (x.over) out += `<path d="${d}" fill="none" stroke="#e0a458" stroke-width="${w+6}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${GAPC()}" stroke-width="${w+2.5}" stroke-linecap="round"/>`;
    // categories and bills read the same way: the coloured part is what's still to go out,
    // the dim part is what's already spent (or paid). Bills drain as each one is paid.
    out += `<path d="${d}" fill="none" stroke="${x.color}" stroke-opacity=".28" stroke-width="${w}" stroke-linecap="round"/>`;
    if (x.fill < 0.999) out += `<path d="${arcPath(a0 + (a1-a0)*Math.max(0,x.fill), a1)}" fill="none" stroke="${x.color}" stroke-width="${w}" stroke-linecap="round"/>`;
    a += sp;
  });
  ringEl.innerHTML = out;
}

(function buildWheel(){

const wms = [...wheel.querySelectorAll('.wm')];

/* category rows scroll sideways under the finger, with a glide on release.
   Driven here so nothing else (sheet drag, the phone's own gestures) can swallow the swipe. */
function dragScroll(el){
  let st = null, raf = 0;
  el.addEventListener('touchstart', e => {
    cancelAnimationFrame(raf); st = null;
    if (e.touches.length !== 1) return;
    const t = e.touches[0]; st = {x:t.clientX, y:t.clientY, sl:el.scrollLeft, on:false, lx:t.clientX, lt:performance.now(), v:0};
  }, {passive:true});
  el.addEventListener('touchmove', e => {
    if (!st) return;
    const t = e.touches[0], dx = t.clientX - st.x, dy = t.clientY - st.y;
    if (!st.on){
      if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) { st.on = true; st.x = t.clientX; st.sl = el.scrollLeft; }
      else if (Math.abs(dy) > 6) { st = null; return; }
      else return;
    }
    e.preventDefault(); e.stopPropagation();
    const now = performance.now(), ddt = Math.max(1, now - st.lt);
    st.v = st.v * 0.3 + ((t.clientX - st.lx) / ddt) * 0.7; st.lx = t.clientX; st.lt = now;
    el.scrollLeft = st.sl - (t.clientX - st.x); el._dragged = Date.now();
  }, {passive:false});
  const end = () => {
    if (!st) return; const s = st; st = null; if (!s.on) return;
    if (performance.now() - s.lt > 80) return;            // finger rested before lifting: no glide
    let v = -s.v * 16, last = performance.now();
    const step = now => { const f = Math.min(3, (now - last) / 16.7); last = now;
      el.scrollLeft += v * f; v *= Math.pow(0.94, f);
      if (Math.abs(v) > 0.25) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
  };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  el.addEventListener('click', e => { if (el._dragged && Date.now() - el._dragged < 250){ e.stopPropagation(); e.preventDefault(); } }, true);
}
document.querySelectorAll('.qa-cats').forEach(dragScroll);
function scrollerIn(el, root){ for (let n = el; n && n !== root; n = n.parentElement){ const cs = getComputedStyle(n); if (/(auto|scroll)/.test(cs.overflowY) && n.scrollHeight > n.clientHeight + 1) return n; } return null; }
document.querySelectorAll('.sheet').forEach(sh => {
  let st = null;
  sh.addEventListener('touchstart', e => {
    st = null;
    if (e.touches.length !== 1 || !sh.classList.contains('on')) return;
    const t = e.target;
    if (t.closest('input[type=range], .swr, [data-nodrag]')) return;
    const sc = scrollerIn(t, sh);
    if (sc && sc.scrollTop > 0) return;                       // let lists scroll first
    const p = e.touches[0];
    st = {x:p.clientX, y:p.clientY, dy:0, on:false, h:sh.offsetHeight, ly:p.clientY, lt:performance.now(), v:0};
  }, {passive:true});
  sh.addEventListener('touchmove', e => {
    if (!st) return;
    const p = e.touches[0], dx = p.clientX - st.x, dy = p.clientY - st.y;
    if (!st.on){
      if (dy > 8 && dy > Math.abs(dx) * 1.2){ st.on = true; st.y = p.clientY; sh.classList.add('dragging'); scrim.classList.add('dragging'); }
      else if (Math.abs(dx) > 8 || dy < -8){ st = null; return; }
      else return;
    }
    const now = performance.now(), d = Math.max(0, p.clientY - st.y);
    st.v = (p.clientY - st.ly) / Math.max(1, now - st.lt); st.ly = p.clientY; st.lt = now;
    st.dy = d;
    sh.style.transform = `translate3d(0,${d}px,0)`;
    scrim.style.opacity = String(Math.max(0, 1 - d / st.h));
    e.preventDefault();
  }, {passive:false});
  const end = () => {
    if (!st) return; const s = st; st = null;
    if (!s.on) return;
    sh.classList.remove('dragging'); scrim.classList.remove('dragging');
    const close = s.dy > Math.min(140, s.h * 0.28) || (s.v > 0.5 && s.dy > 24);
    sh.style.transform = ''; scrim.style.opacity = '';
    if (close) hideSheet(sh);
  };
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
});

  list.addEventListener('pointerdown', e => { const r = e.target.closest('.swr'); if (!r || e.target.closest('.swdel')) return; st = {r, x:e.clientX, y:e.clientY, dx:0, on:false, open:r.classList.contains('open')}; });

    st.dx = dx; const pos = Math.max(0, Math.min(96, (st.open ? 76 : 0) + dir * dx));

  const end = () => { if (!st) return; const r = st.r; r.classList.remove('drag'); r.querySelector('.brw').style.transform = '';
    if (st.on){ const pos = (st.open ? 76 : 0) + dir * st.dx; r.classList.toggle('open', pos > 40); r._swiped = Date.now(); } st = null; };

  list.addEventListener('click', e => { const r = e.target.closest('.swr'); if (r && r._swiped && Date.now() - r._swiped < 300){ e.stopImmediatePropagation(); e.preventDefault(); return; }

function papaMonth(i){

  const sum = t => es.filter(e=>e.t===t).reduce((s,e)=>s+e.c,0);

  const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k;
  if (k === '⌫'){ pinBuf = pinBuf.slice(0,-1); paintDots(); return; }
  if (pinBuf.length >= 4) return; pinBuf += k; paintDots();
  if (pinBuf.length < 4) return;
  await new Promise(r => setTimeout(r, 120));
  if (pinMode === 'unlock'){
    if (await sha(pinBuf) === real.settings.pinHash) hideLock();
    else { lockDots.classList.add('shake'); setTimeout(() => lockDots.classList.remove('shake'), 400); pinBuf = ''; paintDots(); }
  } else if (pinMode === 'set'){ pinFirst = pinBuf; showLock('confirm'); }
  else { if (pinBuf === pinFirst){ real.settings.pinHash = await sha(pinBuf); persist(); hideLock(); renderSettings(); toast('PIN lock is on'); }
         else { lockT.textContent = 'Didn’t match — choose again'; pinMode = 'set'; pinBuf = ''; paintDots(); } }
});
lockEl.addEventListener('click', e => { if (e.target === lockEl && lockEl.classList.contains('cancelable')) hideLock(); });

/* ================= sync (private, per Claude account) ================= */
const DEVICE = (() => { try { let d = localStorage.getItem('rich-dev'); if (!d){ d = Math.random().toString(36).slice(2,10); localStorage.setItem('rich-dev', d); } return d; } catch(e){ return 'x'; } })();
const sync = {ref:null, status:'local', pushing:false, pending:false, at:0, timer:0};
function syncText(){ return {local:'This device only', syncing:'Syncing…', synced:'Synced' + (sync.at ? ' · ' + new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).format(new Date(sync.at)) : ''), offline:'Offline · will sync later', error:'Couldn’t sync'}[sync.status]; }
function setSync(st){ sync.status = st; const d = document.getElementById('st-syncdot'), t = document.getElementById('st-synctxt'); if (d) d.className = 'syncdot ' + st; if (t) t.textContent = syncText(); }
function schedulePush(){ if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushNow, 700); }
async function pushNow(){
  if (!sync.ref) return; if (sync.pushing){ sync.pending = true; return; }
  sync.pushing = true; setSync('syncing');
  try { await sync.ref.set({json: JSON.stringify(real), at: real.updatedAt || Date.now(), dev: DEVICE}); sync.at = Date.now(); setSync('synced'); try { localStorage.setItem('rich-linked','1'); } catch(e){} }
  catch(e){ setSync(e && e.code === 'unavailable' ? 'offline' : 'error'); }
  sync.pushing = false; if (sync.pending){ sync.pending = false; pushNow(); }
}
function applyRemote(d){
  try { const r = JSON.parse(d.json); if (!r || r.v !== 1) return; const demo = real.settings.demo;
    real = r; real.settings.demo = demo; try { localStorage.setItem(KEY, JSON.stringify(real)); localStorage.setItem('rich-linked','1'); } catch(e){}
    applyTheme(); document.body.classList.toggle('demo', !!real.settings.demo); shown = null; refresh({instant:true});
    if (openSheet && openSheet.id === 's-set') renderSettings();
  } catch(e){}
}
const hasData = r => r && (r.expenses.length || (r.allowances||[]).length);
let firstRemote = true;
function onRemote(snapD){
  if (!snapD.exists){ if (!snapD.metadata.fromCache) pushNow(); return; }
  const d = snapD.data(); if (!d || typeof d.json !== 'string') return;
  sync.at = Date.now();
  let linked = false; try { linked = !!localStorage.getItem('rich-linked'); } catch(e){}
  if (d.dev === DEVICE && d.at === real.updatedAt){ setSync(snapD.metadata.hasPendingWrites ? 'syncing' : 'synced'); firstRemote = false; return; }
  if (firstRemote && !linked && !snapD.metadata.fromCache){
    firstRemote = false;
    if (d.json === JSON.stringify(real)) { try { localStorage.setItem('rich-linked','1'); } catch(e){} setSync('synced'); return; }
    let remote = null; try { remote = JSON.parse(d.json); } catch(e){}
    if (!hasData(real)) { applyRemote(d); setSync('synced'); return; }
    if (!hasData(remote)) { pushNow(); return; }
    return ask('Which copy should Rich keep?', 'This device and your synced data are different. The other one will be replaced.', [
      ['Synced copy','pri',() => { applyRemote(d); setSync('synced'); }],
      ['This device','',() => pushNow()]]);
  }
  firstRemote = false;
  if ((d.at || 0) > (real.updatedAt || 0)) applyRemote(d);
  else if ((d.at || 0) < (real.updatedAt || 0) && !snapD.metadata.fromCache) pushNow();
  setSync('synced');
}
async function initSync(){
  try {
    if (!window.claude || !claude.use) return setSync('local');
    const [dbm, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!dbm || !user) return setSync('local');
    const uid = await user.id(); if (!uid) return setSync('local');
    sync.ref = dbm.doc(`data/users/${uid}/state`); setSync('syncing');
    const t = setTimeout(() => { if (sync.status === 'syncing') setSync('offline'); }, 10000);
    sync.ref.onSnapshot(s2 => { clearTimeout(t); onRemote(s2); }, err => { clearTimeout(t); setSync('offline'); });
  } catch(e){ setSync('local'); }
}
addEventListener('online', () => { if (sync.ref) pushNow(); });

/* ================= receipt scanning ================= */
const scSheet = document.getElementById('s-scan'), scBody = document.getElementById('sc-body'), scMsg = document.getElementById('sc-msg');
const scDate = document.getElementById('sc-date');
let scan = null;
function shrink(file, max = 1600){ return new Promise((res, rej) => { const img = new Image(); img.onload = () => {
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', .85); URL.revokeObjectURL(img.src); };
  img.onerror = rej; img.src = URL.createObjectURL(file); }); }
const toC = v => { const n = typeof v === 'number' ? v : parseFloat(String(v||'').replace(/[^\d.\-]/g,'')); return isFinite(n) ? Math.round(n*100) : 0; };
function setScDate(v){ scDate.value = v; document.getElementById('sc-datelbl').textContent = dateLabel(v); }
document.getElementById('qa-scan').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  hideSheet(qa); scan = null; scMsg.textContent = ''; scMsg.className = 'qa-msg';
  document.getElementById('sc-store').textContent = 'Reading receipt…'; setScDate(defaultDate());
  scBody.innerHTML = '<div class="sc-wait"><i class="spin"></i>Reading your receipt…</div>'; document.getElementById('sc-foot').style.display = 'none';
  setTimeout(() => showSheet(scSheet), 150);
  try {
    const cats = DB().categories, mem = real.scanMap || {};
    let out;
    if (NATIVE){ // on-device: Apple text recognition + Apple's on-device model, nothing leaves the phone
      const img = await shrink(f, 2400);
      // The small model answers best with plain names plus examples, so it's given "Food (groceries, meals…)"
      // and asked to answer "Food"; the answer is matched back to Rich's category here.
      const memNames = {}; for (const [k, v] of Object.entries(mem)) memNames[k] = (cats.find(c => c.id === v) || {}).name || v;
      out = await nat('scan', {image: await blobB64(img), memory: memNames,
        categories: cats.map(c => ({id: c.name, name: CAT_HINTS[c.id] ? `${c.name} (${CAT_HINTS[c.id]})` : c.name}))});
      if (out && out.error) throw {code: out.error};
      if (out && Array.isArray(out.items)) out.items.forEach(it => { it.category = catFromAnswer(it.category, cats); });
    } else {
    const sample = await claude.use('sample'); if (!sample) throw {code:'not_granted'};
    const img = await shrink(f);
    const prompt = `You read Philippine store receipts. Extract only what is printed; never invent or estimate numbers. Amounts are in pesos.
Categories (use the id): ${cats.map(c => `${c.id} = ${c.name}`).join('; ')}.
Remembered item categories from the user: ${JSON.stringify(mem).slice(0, 1500)}.
Return JSON only: {"store": string|null, "date": "YYYY-MM-DD"|null, "items": [{"name": string, "amount": number, "category": id, "unsure": boolean}], "subtotal": number|null, "discount": number|null, "total": number|null, "readable": boolean}.
"amount" is the line total for that item. Mark "unsure": true when the name or amount is hard to read. If the image is not a readable receipt, set "readable": false.`;
    out = await sample.json(prompt, {images:[img], modelTier:'default'});
    }
    if (!out || out.readable === false || !Array.isArray(out.items)) throw {code:'unreadable'};
    scan = {store: out.store || 'Receipt', items: out.items.map(it => ({name: cap1(String(it.name||'Item')), c: toC(it.amount), cat: mem[String(it.name||'').toLowerCase()] || ((cats.some(c=>c.id===it.category) && it.category !== 'other') ? it.category : (guessCat(it.name, cats) || 'other')), unsure: !!it.unsure, orig: it.category})),
            discount: Math.abs(toC(out.discount)), total: toC(out.total)};
    if (out.date && parseISO(out.date)) setScDate(out.date);
    renderScan();
  } catch(err){
    const c = err && err.code;
    scBody.innerHTML = `<div class="sc-wait">${c==='not_granted' ? 'Receipt reading isn’t available here.' : c==='model_off' ? 'Turn on Apple Intelligence in Settings → Apple Intelligence & Siri to scan receipts.' : c==='model_loading' ? 'Apple Intelligence is still getting ready. Try again in a little while.' : c==='not_eligible' ? 'This iPhone can’t run Apple’s on-device model.' : c==='unreadable' ? 'Couldn’t read that receipt. Try a sharper, flatter photo — or add it by hand.' : c==='rate_limited' ? 'Too many scans just now. Try again in a minute.' : 'Couldn’t read the receipt. You can add it by hand.'}</div>`;
    document.getElementById('sc-store').textContent = 'Receipt';
  }
});
/* ---- receipt categories: examples for the model, matching its answer, and a keyword safety net ---- */
const CAT_HINTS = {
  food:'groceries, rice, meat, fish, eggs, bread, snacks, drinks, coffee, meals, restaurants, fast food',
  transport:'jeep, bus, train, taxi, Grab, fare, parking, toll',
  gas:'fuel, gasoline, diesel, petrol',
  laundry:'laundry service, detergent, fabric softener, dry cleaning',
  care:'shampoo, soap, toothpaste, lotion, deodorant, medicine, vitamins, toiletries, haircut',
  school:'books, notebooks, pens, paper, printing, photocopy, school supplies, tuition',
  gym:'gym fees, protein, supplements, sports gear',
  clothes:'shirts, pants, shorts, shoes, socks, underwear, apparel',
  shopping:'gadgets, home and kitchen items, gifts, accessories'
};
const CAT_WORDS = {
  food:/\b(rice|bigas|chicken|manok|pork|baboy|beef|fish|isda|egg|itlog|bread|tinapay|milk|gatas|noodle|pancit|canton|sardin|tuna|corned|hotdog|ham|bacon|cheese|butter|sugar|asukal|salt|asin|oil|mantika|soy|toyo|vinegar|suka|sauce|ketchup|mayo|coffee|kape|tea|juice|soda|coke|sprite|royal|water|tubig|beer|snack|chips|biscuit|cookie|candy|choco|cake|pizza|burger|fries|meal|rice ?meal|siopao|siomai|fruit|banana|saging|apple|mango|vegetable|gulay|onion|sibuyas|garlic|bawang|tomato|kamatis|potato|cereal|oat|yogurt|ice ?cream|grocer)/i,
  care:/\b(shampoo|conditioner|soap|sabon|safeguard|dove|toothpaste|colgate|toothbrush|lotion|deodorant|rexona|tissue|napkin|pad|diaper|alcohol|sanitizer|vitamin|medicine|gamot|biogesic|neozep|tablet|capsule|razor|cotton|facial|cleanser|sunscreen|haircut)/i,
  laundry:/\b(detergent|surf|ariel|tide|breeze|downy|fabcon|fabric ?con|zonrox|bleach|laundry)/i,
  gas:/\b(gasoline|diesel|unleaded|premium 9|fuel|petron|shell|caltex|seaoil)/i,
  school:/\b(notebook|pen|pencil|paper|bond|folder|book|print|photocopy|xerox|highlighter|eraser|ruler|scotch|tape)/i,
  clothes:/\b(shirt|tee|pants|jeans|shorts|dress|skirt|shoe|sneaker|slipper|sock|brief|boxer|underwear|jacket|hoodie)/i,
  transport:/\b(fare|parking|toll|grab|angkas|joyride|taxi|bus|jeep|lrt|mrt|beep)/i
};
function catFromAnswer(ans, cats){
  const s = String(ans || '').toLowerCase().replace(/\(.*$/, '').trim();
  if (!s) return 'other';
  const c = cats.find(c => c.name.toLowerCase() === s) || cats.find(c => c.id === s)
         || cats.find(c => s.startsWith(c.name.toLowerCase()) || c.name.toLowerCase().startsWith(s));
  return c ? c.id : 'other';
}
function guessCat(name, cats){
  const n = String(name || '');
  for (const [id, re] of Object.entries(CAT_WORDS)) if (re.test(n) && cats.some(c => c.id === id)) return id;
  return null;
}
function renderScan(){
  if (!scan) return; const cats = DB().categories;
  document.getElementById('sc-store').textContent = scan.store;
  const sum = scan.items.reduce((s,it)=>s+it.c,0), net = sum - scan.discount, total = scan.total || net, mismatch = scan.total && Math.abs(net - scan.total) > 1;
  scBody.innerHTML = scan.items.map((it, n) => `<div class="sc-row${it.unsure?' unsure':''}">
      <span class="nm">${esc(it.name)}${it.unsure?'<small>Check this one</small>':''}</span>
      <select data-sc="${n}" aria-label="Category for ${esc(it.name)}">${cats.map(c => `<option value="${c.id}"${c.id===it.cat?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <span class="money">₱<input data-sa="${n}" data-num inputmode="decimal" value="${(it.c/100).toFixed(2)}" aria-label="Amount for ${esc(it.name)}"></span></div>`).join('') +
    `<div class="sc-tot">${scan.discount ? `<div><span>Discount</span><b>−${fmt(scan.discount,true)}</b></div>` : ''}
      <div><span>Items</span><b>${fmt(net,true)}</b></div><div class="big"><span>Receipt total</span><b>${fmt(total,true)}</b></div></div>`;
  scMsg.className = 'qa-msg' + (mismatch ? ' warn' : ''); scMsg.textContent = mismatch ? `Items add up to ${fmt(net,true)}, not ${fmt(scan.total,true)} — check the amounts` : (scan.items.some(i=>i.unsure) ? 'Check the highlighted items before saving' : '');
  const top = Object.entries(scan.items.reduce((m,it)=>(m[it.cat]=(m[it.cat]||0)+it.c,m),{})).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sc-total').textContent = `Save ${fmt(total)} to ${(cats.find(c=>c.id===(top?top[0]:'other'))||{name:'Other'}).name}`;
  document.getElementById('sc-foot').style.display = '';
}
scBody.addEventListener('change', e => {
  const sc = e.target.dataset.sc, sa = e.target.dataset.sa;
  if (sc !== undefined){ scan.items[+sc].cat = e.target.value; scan.items[+sc].touched = true; }
  if (sa !== undefined){ scan.items[+sa].c = parseAmount(e.target.value); scan.items[+sa].unsure = false; }
  renderScan();
});
scDate.addEventListener('change', () => { if (parseISO(scDate.value)) setScDate(scDate.value); });
function saveScan(split){
  if (!scan) return; const db = DB(), s0 = snap(), date = scDate.value;
  const sum = scan.items.reduce((s,it)=>s+it.c,0), net = sum - scan.discount, total = scan.total || net;
  const byCat = scan.items.reduce((m,it)=>(m[it.cat]=(m[it.cat]||0)+it.c,m),{});
  let rows;
  if (!split){ const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0]; rows = [[top ? top[0] : 'other', total]]; }
  else { // spread any discount across categories so the parts add up exactly to the total
    const ent = Object.entries(byCat), base = ent.reduce((s,[,v])=>s+v,0) || 1; let alloc = ent.map(([k,v]) => [k, Math.floor(v * total / base)]);
    let rest = total - alloc.reduce((s,[,v])=>s+v,0); for (let i=0; rest>0; i=(i+1)%alloc.length, rest--) alloc[i][1]++;
    rows = alloc.filter(([,v]) => v > 0); }
  rows.forEach(([cat, c]) => db.expenses.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), date, cat, c, at: Date.now(), src:'scan'}));
  real.scanMap ||= {}; scan.items.forEach(it => { if (it.touched) real.scanMap[it.name.toLowerCase()] = it.cat; });
  persist(); hideSheet(scSheet); scan = null; const d = parseISO(date), i = mIndex(d.y,d.m); if (i !== sel) goMonth(i);
  setTimeout(() => refresh(), i!==sel?380:0); toast(split ? `Saved ${rows.length} expense${rows.length>1?'s':''}` : 'Receipt saved', s0);
}
document.getElementById('sc-total').addEventListener('click', () => saveScan(false));
document.getElementById('sc-split').addEventListener('click', () => saveScan(true));

/* ================= numeric-only inputs ================= */
function cleanNum(v){
  v = String(v).replace(/[^\d.]/g,'');
  const i = v.indexOf('.');
  if (i >= 0) v = v.slice(0,i+1) + v.slice(i+1).replace(/\./g,'').slice(0,2);
  return v.replace(/^0+(?=\d)/,'').slice(0,12);
}
stage.addEventListener('beforeinput', e => {
  const el = e.target; if (!el.matches || !el.matches('input[data-num]')) return;
  if (e.data && /[^\d.,]/.test(e.data)) e.preventDefault();
});
stage.addEventListener('input', e => {
  const el = e.target; if (!el.matches || !el.matches('input[data-num]') || el.id === 'qa-amount') return;
  const c = cleanNum(el.value); if (c !== el.value) el.value = c;
}, true);
stage.addEventListener('keydown', e => {
  const el = e.target; if (!el.matches || !el.matches('input[data-num]')) return;
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !/[\d.,]/.test(e.key)) e.preventDefault();
}, true);

applyTheme();
if (real.settings.pinHash) showLock('unlock');
real.settings.demo = false; document.body.classList.remove('demo');
fit();
setTimeout(initSync, 0);
requestAnimationFrame(() => {
  goMonth(curIdx, true);
  refresh({instant:true});
  if (location.hash === '#add') openQuickAdd();

addEventListener('hashchange', () => { if (location.hash==='#add') openQuickAdd(); });
/* tell the iPhone app this page started fine (it falls back to the built-in page otherwise) */
if (NATIVE) nat('ready').catch(() => {});
})();
